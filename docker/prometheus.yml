global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Bor nodes — pprof metrics endpoint
  - job_name: 'bor-nodes'
    metrics_path: '/debug/metrics/prometheus'
    static_configs:
      - targets:
          - '172.25.0.10:7071'
          - '172.25.0.11:7071'
          - '172.25.0.12:7071'
          - '172.25.0.13:7071'
          - '172.25.0.14:7071'
          - '172.25.0.15:7071'
          - '172.25.0.16:7071'
          - '172.25.0.17:7071'
        labels:
          network: 'autoresearch-devnet'
    relabel_configs:
      - source_labels: [__address__]
        regex: '172.25.0.10:.*'
        target_label: node
        replacement: 'node-0-us-east'
      - source_labels: [__address__]
        regex: '172.25.0.11:.*'
        target_label: node
        replacement: 'node-1-eu-west'
      - source_labels: [__address__]
        regex: '172.25.0.12:.*'
        target_label: node
        replacement: 'node-2-eu-central'
      - source_labels: [__address__]
        regex: '172.25.0.13:.*'
        target_label: node
        replacement: 'node-3-ap-southeast'
      - source_labels: [__address__]
        regex: '172.25.0.14:.*'
        target_label: node
        replacement: 'node-4-ap-northeast'
      - source_labels: [__address__]
        regex: '172.25.0.15:.*'
        target_label: node
        replacement: 'node-5-ap-south'
      - source_labels: [__address__]
        regex: '172.25.0.16:.*'
        target_label: node
        replacement: 'node-6-sa-east'
      - source_labels: [__address__]
        regex: '172.25.0.17:.*'
        target_label: node
        replacement: 'node-7-ap-southeast-2'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
