# Polygon POS Node (Bor) - Base Configuration
# This is the default configuration used as baseline for experiments.
# Do NOT modify this file — copy to experiment.toml and modify there.

chain = "mumbai"
identity = "autoresearch-node"
verbosity = 3
log-level = ""
datadir = "./data/bor"
ancient = ""
keystore = ""

syncmode = "full"
gcmode = "full"
snapshot = true

bor.logs = false
bor.heimdall = "http://localhost:1317"
bor.runheimdall = true
bor.runheimdallargs = ""
bor.useheimdallapp = false
bor.devfakeauthor = true

ethstats = ""
devfakeauthor = false

["eth.requiredblocks"]

[log]
  vmodule = ""
  json = false
  backtrace = ""
  debug = false

[p2p]
  maxpeers = 50
  maxpendpeers = 50
  bind = "0.0.0.0"
  port = 30303
  nodiscover = false
  nat = "any"

[p2p.discovery]
  v5disc = false
  bootnodes = []
  bootnodesv4 = []
  bootnodesv5 = []
  static-nodes = []
  trusted-nodes = []
  dns = []

[heimdall]
  url = "http://localhost:1317"
  "bor.without" = false
  grpc-address = ""
  "bor.runheimdall" = true
  "bor.runheimdallargs" = ""
  "bor.useheimdallapp" = false

[txpool]
  locals = []
  nolocals = false
  journal = "transactions.rlp"
  rejournal = "1h0m0s"
  pricelimit = 1
  pricebump = 10
  accountslots = 16
  globalslots = 32768
  accountqueue = 64
  globalqueue = 8192
  lifetime = "3h0m0s"

[miner]
  mine = false
  etherbase = ""
  gaslimit = 30000000
  gasprice = "1000000000"
  extradata = ""

[jsonrpc]
  ipcdisable = false
  ipcpath = ""
  gascap = 50000000
  evmtimeout = "5s"
  txfeecap = 5.0
  allow-unprotected-txs = false
  enabledeprecatedpersonal = false

  [jsonrpc.http]
    enabled = false
    port = 8545
    prefix = ""
    host = "localhost"
    api = ["eth", "net", "web3", "txpool", "bor"]
    vhosts = ["localhost"]
    corsdomain = ["localhost"]
    ep-size = 40
    ep-requesttimeout = "0s"

  [jsonrpc.ws]
    enabled = false
    port = 8546
    prefix = ""
    host = "localhost"
    api = ["eth", "net", "web3", "txpool", "bor"]
    origins = ["localhost"]
    ep-size = 40
    ep-requesttimeout = "0s"

  [jsonrpc.graphql]
    enabled = false
    port = 0
    prefix = ""
    host = ""
    vhosts = ["localhost"]
    corsdomain = ["localhost"]
    ep-size = 40
    ep-requesttimeout = "0s"

[gpo]
  blocks = 20
  percentile = 60
  maxheaderhistory = 1024
  maxblockhistory = 1024
  maxprice = "500000000000"
  ignoreprice = "2"

[telemetry]
  metrics = false
  expensive = false
  prometheus-addr = ""
  opencollector-endpoint = ""

  [telemetry.influx]
    influxdb = false
    endpoint = ""
    database = ""
    username = ""
    password = ""
    influxdbv2 = false
    token = ""
    bucket = ""
    organization = ""
    [telemetry.influx.tags]

[cache]
  cache = 1024
  database = 50
  trie = 15
  gc = 25
  snapshot = 10
  noprefetch = false
  preimages = false
  triesinmemory = 128
  txlookuplimit = 2350000
  timeout = "1h0m0s"
  fdlimit = 0

[leveldb]
  [leveldb.compaction]
    [leveldb.compaction.table]
      size = 2
      count = 0
    [leveldb.compaction.total]
      size = 10
  [leveldb.compaction.size]
    state = 0
  [leveldb.compaction.level]
    state = 0

[accounts]
  unlock = []
  password = ""
  allow-insecure-unlock = false
  lightkdf = false
  disable-bor-wallet = true

[grpc]
  addr = ":3131"

[developer]
  dev = false
  period = 0
  gaslimit = 11500000

[parallelevm]
  enable = false
  procs = 8

[pprof]
  pprof = false
  port = 6060
  addr = "127.0.0.1"
  memprofilerate = 524288
  blockprofilerate = 0
